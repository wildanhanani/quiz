<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline | BelajarUji</title>
    <meta name="theme-color" content="#10b981">
    <style>
        :root {
            color-scheme: light;
        }
        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: min(100%, 420px);
            background: #ffffff;
            border: 1px solid #dbeafe;
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
            padding: 28px;
        }
        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        h1 {
            margin: 16px 0 10px;
            font-size: 28px;
            line-height: 1.1;
        }
        p {
            margin: 0;
            color: #475569;
            line-height: 1.6;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        a, button {
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 12px 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        a {
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
        }
        button {
            background: #e2e8f0;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="badge">Offline</span>
        <h1>Koneksi sedang tidak tersedia</h1>
        <p>BelajarUji masih bisa dibuka sebagian dari cache, tetapi halaman ini membutuhkan koneksi internet untuk mengambil data terbaru.</p>
        <div class="actions">
            <a href="/">Kembali ke Beranda</a>
            <button type="button" onclick="window.location.reload()">Coba Lagi</button>
        </div>
    </main>
</body>
</html>
