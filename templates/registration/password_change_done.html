{% extends 'base.html' %}

{% block content %}
<div class="flex min-h-[calc(100vh-200px)] items-center justify-center bg-gray-50 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-md text-center">
        <div class="rounded-2xl bg-white px-6 py-10 shadow-sm sm:px-10 border border-gray-100">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-green-100 mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="text-green-600">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                    <polyline points="22 4 12 14.01 9 11.01" />
                </svg>
            </div>

            <h2 class="text-2xl font-bold tracking-tight text-gray-900">Perubahan Berhasil!</h2>
            <p class="mt-4 text-gray-600">
                Password Anda telah berhasil diperbarui. Silakan gunakan password baru Anda untuk login berikutnya.
            </p>

            <div class="mt-8 space-y-3">
                <a href="{% url 'dashboard' %}"
                    class="flex w-full justify-center rounded-full bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-blue-500 transition">
                    Kembali ke Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
