{% extends 'base.html' %}
{% load socialaccount %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-12 bg-gray-50">
    <div class="bg-white p-10 rounded-2xl border-2 border-gray-200 w-full max-w-md shadow-xl">
        <h2 class="text-3xl font-bold text-center mb-8 text-gray-900">Masuk ke Akun</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            {% if form.errors %}
            <div class="bg-red-50 border-2 border-red-200 p-4 rounded-lg text-red-700">
                <p class="font-semibold">Username atau password salah.</p>
            </div>
            {% endif %}

            <div>
                <label for="id_username" class="block mb-2 text-gray-700 font-medium">Username</label>
                <input type="text" name="username" autofocus required id="id_username"
                    class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg text-gray-900 focus:border-primary focus:outline-none transition">
            </div>

            <div>
                <label for="id_password" class="block mb-2 text-gray-700 font-medium">Password</label>
                <input type="password" name="password" required id="id_password"
                    class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg text-gray-900 focus:border-primary focus:outline-none transition">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-lg font-semibold transition shadow-lg">
                Login
            </button>
        </form>

        {% if google_login_enabled %}
        <div class="mt-6">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">Atau lanjutkan dengan</span>
                </div>
            </div>

            <div class="mt-6">
                <a href="{% provider_login_url 'google' %}"
                    class="w-full flex items-center justify-center gap-3 px-4 py-3 border-2 border-gray-200 rounded-lg shadow-sm bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                    <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 24 24">
                        <path
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                            fill="#4285F4" />
                        <path
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                            fill="#34A853" />
                        <path
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                            fill="#FBBC05" />
                        <path
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                            fill="#EA4335" />
                    </svg>
                    Google
                </a>
            </div>
        </div>
        {% endif %}

        <p class="text-center mt-6 text-gray-600">
            Belum punya akun? <a href="{% url 'register' %}" class="text-primary hover:underline font-semibold">Daftar
                di sini</a>
        </p>
    </div>
</section>
{% endblock %}
