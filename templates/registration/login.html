{% extends 'base.html' %}

{% block content %}
<section class="min-h-screen flex items-center justify-center py-12 bg-gray-50">
    <div class="bg-white p-10 rounded-2xl border-2 border-gray-200 w-full max-w-md shadow-xl">
        <h2 class="text-3xl font-bold text-center mb-8 text-gray-900">Masuk ke Akun</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            {% if form.errors %}
            <div class="bg-red-50 border-2 border-red-200 p-4 rounded-lg text-red-700">
                <p class="font-semibold">Username atau password salah.</p>
            </div>
            {% endif %}

            <div>
                <label for="id_username" class="block mb-2 text-gray-700 font-medium">Username</label>
                <input type="text" name="username" autofocus required id="id_username"
                    class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg text-gray-900 focus:border-primary focus:outline-none transition">
            </div>

            <div>
                <label for="id_password" class="block mb-2 text-gray-700 font-medium">Password</label>
                <input type="password" name="password" required id="id_password"
                    class="w-full px-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-lg text-gray-900 focus:border-primary focus:outline-none transition">
            </div>

            <button type="submit"
                class="w-full bg-primary hover:bg-primary-dark text-white px-6 py-3 rounded-lg font-semibold transition shadow-lg">
                Login
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Belum punya akun? <a href="{% url 'register' %}" class="text-primary hover:underline font-semibold">Daftar
                di sini</a>
        </p>
    </div>
</section>
{% endblock %}
